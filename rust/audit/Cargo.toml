[package]
name = "smooai-audit"
version = "0.2.1"
edition = "2021"
description = "Polyglot client SDK for tamper-evident, SQL-queryable audit logging — Rust port of @smooai/audit."
license = "MIT"
repository = "https://github.com/SmooAI/audit"
homepage = "https://github.com/SmooAI/audit"
keywords = ["audit", "tamper-evident", "hash-chain", "smooai", "observability"]
categories = ["development-tools::debugging"]
readme = "README.md"

[features]
# The HTTP emit client (AuditClient) is on by default for standalone SDK use.
# Consumers that only need the schema + canonical + hash chain (e.g. a service
# that publishes events onto its own transport like NATS) can depend with
# `default-features = false` to drop the reqwest + async-runtime pull entirely.
default = ["client"]
client = ["dep:reqwest"]
# W3C trace correlation on the emit ENVELOPE (never inside the hashed event).
# Off by default: an OSS audit SDK must not force OpenTelemetry on anyone. With
# the feature off, `TraceContext::current()` is an empty-struct no-op and nothing
# here links OTel at all.
otel = ["dep:opentelemetry", "dep:tracing", "dep:tracing-opentelemetry"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "1"
# HTTP emit client. rustls-only (no OpenSSL) to match the workspace's
# native-TLS-free posture; no json feature — we POST the exact canonical bytes,
# not a re-serialization. reqwest brings its own async runtime. Optional so
# schema-only consumers avoid it (see the `client` feature above).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
# Trace correlation, OPTIONAL by design (see the `otel` feature above).
opentelemetry = { version = "0.32", optional = true, default-features = false, features = ["trace"] }
# Needed to read a `tracing` span's OTel context. Every SmooAI Rust service
# carries its span through a tracing-opentelemetry layer, and
# `opentelemetry::Context::current()` does NOT necessarily see those — reading
# only the OTel-native context would make the feature a no-op in production.
tracing = { version = "0.1", optional = true }
tracing-opentelemetry = { version = "0.33", optional = true, default-features = false }

[dev-dependencies]
# The correlation tests drive a real tracer so the assertion is on the ids that
# actually reach the envelope, not on our own builder.
opentelemetry_sdk = { version = "0.32", features = ["trace"] }
tracing-subscriber = { version = "0.3", features = ["registry"] }
