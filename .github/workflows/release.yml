name: Release (Changesets 🦋)

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  version:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: write
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/audit -> rust/audit/target
          cache-on-failure: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install dependencies
        run: pnpm install

      - name: Version consistency
        run: pnpm version:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Format check
        # CHECK, never write. This step used to run `pnpm format` in write mode and
        # nothing committed the result, so the release job reached
        # `cargo publish` with a dirty tree — which is the only reason
        # `--allow-dirty` was ever needed. Formatting is a gate, not a release
        # side effect.
        run: pnpm format:check

      - name: Version Update 🦋
        id: changesets
        uses: changesets/action@v1
        with:
          commit: "🦋 New version release"
          title: "🦋 New version release"
          # `pnpm run version` = `changeset version && sync-versions`. Without this
          # input the action runs `changeset version` directly and the package.json
          # `version` script never fires — which is how the non-TS manifests stayed
          # at 0.0.0 while npm/PyPI/NuGet shipped 0.2.0. The action commits the
          # working tree after this step, so the synced manifests land in the
          # release commit.
          version: pnpm run version
          publish: pnpm ci:publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          NPM_TOKEN: ${{ secrets.SMOOAI_NPM_TOKEN }}

      - name: Publish smooai-audit to PyPI
        if: steps.changesets.outputs.published == 'true'
        working-directory: python
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.SMOOAI_PYPI_TOKEN }}
        run: |
          # Clean stale build artifacts to prevent re-uploading old versions
          rm -rf dist/
          uv run poe publish

      - name: Publish smooai-audit to crates.io
        if: steps.changesets.outputs.published == 'true'
        # --locked, never --allow-dirty: the manifests are synced in the changesets
        # `version` lifecycle and committed with the release, so the tree is clean
        # and Cargo.lock already carries the released version. A failure here means
        # the lockfile is genuinely stale — refresh and commit it, don't loosen the flag.
        run: cargo publish --locked --manifest-path rust/audit/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.SMOOAI_CARGO_REGISTRY_TOKEN }}

      - name: Tag and publish Go module
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="go/v${VERSION}"
          # The tag major and the go.mod module-path suffix must agree or
          # `go get` resolves nothing. version:check enforces the same rule on
          # every PR; re-assert it here because this is the step that mints the
          # tag the module proxy will cache forever.
          pnpm version:check
          echo "Creating Go module tag: ${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"
          echo "Go module tagged and pushed: ${TAG}"

      - name: Build and test .NET
        if: steps.changesets.outputs.published == 'true'
        working-directory: dotnet
        run: |
          dotnet restore SmooAI.Audit.sln
          dotnet build SmooAI.Audit.sln -c Release --no-restore
          dotnet test SmooAI.Audit.sln -c Release --no-build --nologo

      - name: Pack and publish SmooAI.Audit to NuGet
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Packing SmooAI.Audit ${VERSION}"
          dotnet pack dotnet/src/SmooAI.Audit/SmooAI.Audit.csproj \
            --configuration Release \
            -p:Version=${VERSION} \
            -p:PackageVersion=${VERSION} \
            -o dotnet/artifacts
          for pkg in dotnet/artifacts/*.nupkg; do
            echo "Pushing $pkg to NuGet..."
            dotnet nuget push "$pkg" \
              --api-key "${NUGET_API_KEY}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
        env:
          NUGET_API_KEY: ${{ secrets.SMOOAI_NUGET_API_KEY }}

      - name: Auto-Merge Changeset PR
        run: |
          PR_NUMBER=$(gh pr list --state open --head changeset-release/main --json number --jq '.[0].number')

          if [[ -n "$PR_NUMBER" && "$PR_NUMBER" != "null" ]]; then
            echo "Found Changeset PR #$PR_NUMBER, attempting to auto-merge..."
            gh pr merge "$PR_NUMBER" --auto --squash
            # The merge push automatically triggers the Release workflow
            # so no need to manually re-trigger it
          else
            echo "No open Changeset PR found, skipping merge."
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
